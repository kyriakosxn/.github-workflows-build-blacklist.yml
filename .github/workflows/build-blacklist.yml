name: build-blacklist

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build blacklist.rsc
        run: |
          curl -fsSL https://raw.githubusercontent.com/firehol/blocklist-ipsets/master/firehol_level2.netset -o src.txt
          {
            echo '/ip firewall address-list remove [find list=blacklist dynamic=yes]'
            echo '/ip firewall address-list'
            grep -Eo '^[0-9]{1,3}(\.[0-9]{1,3}){3}(/[0-9]{1,2})?' src.txt \
              | awk '{print "add list=blacklist address=" $1 " timeout=2d"}'
          } > blacklist.rsc
          rm src.txt
          wc -l blacklist.rsc

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add blacklist.rsc
          git diff --cached --quiet || git commit -m "update blacklist"
          git push

